name: Build & Publish Switchroot Release

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Installer and Create Release
    runs-on: ubuntu-latest
    env:
      DESKTOP_ENV: xfce4

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Maximize Runner Disk Space
        run: |
          echo "=== Espacio en disco inicial ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "=== Espacio en disco tras optimización ==="
          df -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calculate Next Version & Generate Changelog
        id: bump
        run: |
          python3 tools/bump_version.py RELEASE_NOTES.md

      - name: Install System Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap mmdebstrap qemu-user-static binfmt-support \
            git build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            bison flex libssl-dev bc libncurses-dev kmod \
            dosfstools parted rsync u-boot-tools e2fsprogs zip \
            p7zip-full curl
          which 7z >/dev/null 2>&1 || sudo apt-get install -y 7zip || true

      - name: Build Debian 13 RootFS and Kernel
        run: |
          chmod +x build.sh autoinstall_prerequisites.sh pack_l4t_installer.sh tools/*.py tools/*.sh
          sudo -E ./build.sh

      - name: Run L4T Packaging Script
        run: |
          sudo -E ./pack_l4t_installer.sh

      - name: Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: "Switchroot Debian 13 (Trixie) [${{ env.DESKTOP_ENV }}] ${{ steps.bump.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            build_output/switch-debian-13-trixie-${{ env.DESKTOP_ENV }}-installer-hekate.zip
            build_output/switch-debian-13-trixie-${{ env.DESKTOP_ENV }}-fat32.zip
            build_output/switch-debian-13-trixie-${{ env.DESKTOP_ENV }}-rootfs.tar.gz
            build_output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
